<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxy Pizza Game Website</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-color: #252538;
            --accent-color: #ff6b4a;
            --accent-hover: #e05334;
            --text-color: #ffffff;
            --text-muted: #a5a5b5;
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: var(--card-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 2px solid #33334d;
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-box {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 4px solid var(--accent-color);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #4a4a5a;
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        .cooldown-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 5px;
            display: none;
        }

        .chat-simulation {
            margin-top: 30px;
            background-color: #11111a;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border: 1px solid #2d2d3d;
        }

        .chat-log {
            margin: 5px 0;
            line-height: 1.4;
        }

        .bot-response {
            color: #5865F2; /* Discord Blurple style */
            font-weight: bold;
        }
        
        .user-action {
            color: #00b0f4;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🍕 Bloxy Pizza Game</h1>
        
        <div class="status-box" id="statusMessage">
            👋 Welcome! Press "Eat Salad" to start your food journey!
        </div>

        <div class="btn-group">
            <button id="eatBtn">🥗 Step 1: Eat Salad</button>
            
            <div>
                <button id="pizzaBtn" disabled>🍕 Step 2: Claim !pizza</button>
                <div class="cooldown-text" id="cooldownDisplay">Stomach cooling down... 60s remaining</div>
            </div>
        </div>

        <div class="chat-simulation" id="chatWindow">
            <div class="chat-log" style="color: var(--text-muted);">[System] Bloxy Pizza Engine Online. Ready to process.</div>
        </div>
    </div>

    <script>
        // Game Logic State variables
        let isReadyForPizza = false;
        let cooldownActive = false;
        let cooldownTimer = null;
        let secondsRemaining = 0;

        // UI Element Selectors
        const eatBtn = document.getElementById('eatBtn');
        const pizzaBtn = document.getElementById('pizzaBtn');
        const statusMessage = document.getElementById('statusMessage');
        const cooldownDisplay = document.getElementById('cooldownDisplay');
        const chatWindow = document.getElementById('chatWindow');

        // Helper function to append message to the "live console log" box
        function logMessage(sender, text, type) {
            const logEntry = document.createElement('div');
            logEntry.className = 'chat-log';
            
            if (type === 'bot') {
                logEntry.innerHTML = `<span class="bot-response">🤖 Bot:</span> ${text}`;
            } else {
                logEntry.innerHTML = `<span class="user-action">👤 You:</span> typed <strong>"${sender}"</strong>`;
            }
            
            chatWindow.appendChild(logEntry);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Auto-scroll to bottom
        }

        // Action 1: User clicks "Eat Salad"
        eatBtn.addEventListener('click', () => {
            isReadyForPizza = true;
            
            // UI Visual updates
            statusMessage.style.borderLeftColor = 'var(--success-color)';
            statusMessage.innerText = "🥗 Finished eating! Click 'Claim !pizza' for your reward!";
            pizzaBtn.disabled = false;

            // Log output tracking
            logMessage('Eat', '', 'user');
            logMessage('', '🥗 Finished eating! Now type or press **`!pizza`** to get your reward!', 'bot');
        });

        // Action 2: User clicks "Claim !pizza"
        pizzaBtn.addEventListener('click', () => {
            logMessage('!pizza', '', 'user');

            // 1. Check if they are stuck in active cooldown
            if (cooldownActive) {
                logMessage('', `⏱️ Slow down! Your stomach needs a break. Wait **${secondsRemaining}s**!`, 'bot');
                return;
            }

            // 2. Validate they completed the "Eat Salad" prerequisite stage 
            if (isReadyForPizza) {
                isReadyForPizza = false; // Reset setup phase
                statusMessage.style.borderLeftColor = 'var(--accent-color)';
                statusMessage.innerText = "🍕 BOOM! Fresh Bloxy Pizza delivered! Enjoy!";
                logMessage('', '🍕 **BOOM!** Fresh Bloxy Pizza delivered! Enjoy your meal!', 'bot');
                
                // Start a strict 60 second delay cycle matching backend rules
                startCooldown(60);
            } else {
                statusMessage.style.borderLeftColor = 'var(--error-color)';
                statusMessage.innerText = "❌ Hold on! You must Eat before you can get a pizza!";
                logMessage('', '❌ Hold on! You must press **`Eat`** before you can get a pizza!', 'bot');
            }
        });

        // Cooldown processing loop
        function startCooldown(durationSeconds) {
            cooldownActive = true;
            secondsRemaining = durationSeconds;
            
            pizzaBtn.disabled = true;
            eatBtn.disabled = true; // Lock system during standard timer sequence
            cooldownDisplay.style.display = 'block';
            cooldownDisplay.innerText = `⏱️ Stomach cooling down... ${secondsRemaining}s remaining`;

            cooldownTimer = setInterval(() => {
                secondsRemaining--;
                cooldownDisplay.innerText = `⏱️ Stomach cooling down... ${secondsRemaining}s remaining`;

                if (secondsRemaining <= 0) {
                    clearInterval(cooldownTimer);
                    cooldownActive = false;
                    cooldownDisplay.style.display = 'none';
                    eatBtn.disabled = false; // Release lock state loop
                    statusMessage.innerText = "🥗 Ready to eat again! Press Eat Salad.";
                    logMessage('[System]', 'Cooldown cleared. Player can eat again.', 'bot');
                }
            }, 1000);
        }
    </script>
</body>
</html>
